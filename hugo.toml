baseURL = "https://zssite.online/"
languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"
title = "zssite"
theme = "PaperMod"

# 主导航
[[menu.main]]
  identifier = "about"
  name = "关于"
  url = "/about/"
  weight = 10

[[menu.main]]
  identifier = "archives"
  name = "归档"
  url = "/archives/"
  weight = 20

[[menu.main]]
  identifier = "search"
  name = "搜索"
  url = "/search/"
  weight = 30

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS"]
  page = ["HTML"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  env = "production"
  description = "风来的个人博客 — 记录学习与研究"
  author = "风来"
  keywords = ["blog", "zssite"]
  DateFormat = "2006-01-02"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  ShowCanonicalLink = true
  comments = true
  mainSections = ["posts"]

# Profile 模式
[params.profileMode]
  enabled = true
  title = "我是风来 👋"
  subtitle = "记录学习、研究、折腾、躺平的日志"
  imageUrl = "/images/profile.jpg"
  imageWidth = 120
  imageHeight = 120
  [[params.profileMode.buttons]]
    name = "文章"
    url = "/posts/"
  [[params.profileMode.buttons]]
    name = "关于"
    url = "/about/"
  [[params.profileMode.buttons]]
    name = "GitHub"
    url = "https://github.com/zsdfbb"
  [[params.profileMode.buttons]]
    name = "RSS"
    url = "/index.xml"

# 首页信息卡
[params.homeInfoParams]
  Title = "欢迎来到 zssite.online"
  Content = """记录学习、研究、折腾、躺平的日志。"""

# Giscus 评论
[params.giscus]
  enable = true
  repo = "zsdfbb/zssite_online"
  repoId = "R_kgDOS-gO9Q"
  category = "Announcements"
  categoryId = "DIC_kwDOS-gO9c4C_iZq"
  mapping = "pathname"
  strict = "0"
  reactionsEnabled = "1"
  emitMetadata = "0"
  inputPosition = "top"
  theme = "preferred_color_scheme"
  lang = "zh-CN"
  lazyLoading = true

# 搜索
[params.fuseOpts]
  isCaseSensitive = false
  shouldSort = true
  location = 0
  distance = 1000
  threshold = 0.4
  minMatchCharLength = 0
  limit = 10
  keys = ["title", "permalink", "summary", "content"]

# 社交图标
[[params.socialIcons]]
  name = "github"
  title = "GitHub"
  url = "https://github.com/zsdfbb"
